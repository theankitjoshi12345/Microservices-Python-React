services:
  main:
    build:
      context: .
      dockerfile: Dockerfile
    command: 'python main.py '
    ports: 
      - "8001:5001"
    volumes:
      - .:/app
    environment:
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in main/.env}
    depends_on:
      db:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: 'python consumer.py'
    depends_on:
      db:
        condition: service_healthy


  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: main
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in main/.env}
    volumes:
      - .dbdata:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck: # 👈 REQUIRED: You must add this so 'service_healthy' knows what to check!
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5
